olist:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('PG_HOST', 'postgres') }}"
      user: "{{ env_var('POSTGRES_USER', 'de') }}"
      pass: "{{ env_var('POSTGRES_PASSWORD') }}"
      dbname: "{{ env_var('POSTGRES_DB', 'olist') }}"
      port: 5432
      schema: public
      threads: 4
