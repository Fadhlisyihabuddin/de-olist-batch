<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 540" width="100%" height="100%" style="background:#ffffff; font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>

    <!-- Marker Arrowheads -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#8b5cf6"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="30" y="38" font-size="20" font-weight="700" fill="#0f172a">Olist E-Commerce Batch ELT Pipeline</text>
  <text x="30" y="60" font-size="12" fill="#64748b">End-to-End Idempotent Data Pipeline &amp; Analytics Engineering Architecture</text>

  <!-- Outer Docker Container Box -->
  <rect x="20" y="80" width="980" height="440" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="40" y="105" font-size="11" font-weight="700" fill="#475569" letter-spacing="0.5">CONTAINERIZED RUNTIME (DOCKER COMPOSE &amp; AWS VPS)</text>

  <!-- ==================== COLUMN 1: DATA SOURCE ==================== -->
  <g transform="translate(40, 125)">
    <rect width="160" height="240" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#shadow)"/>
    <rect width="160" height="34" rx="8" fill="#f1f5f9"/>
    <text x="80" y="22" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">Data Source</text>

    <!-- Sub items -->
    <rect x="15" y="48" width="130" height="48" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="80" y="68" font-size="11" font-weight="600" fill="#1e293b" text-anchor="middle">Kaggle Olist</text>
    <text x="80" y="84" font-size="9" fill="#64748b" text-anchor="middle">Brazilian E-Commerce</text>

    <g transform="translate(15, 108)">
      <rect width="130" height="24" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="65" y="16" font-size="10" fill="#475569" text-anchor="middle">olist_orders.csv</text>
    </g>
    <g transform="translate(15, 138)">
      <rect width="130" height="24" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="65" y="16" font-size="10" fill="#475569" text-anchor="middle">olist_payments.csv</text>
    </g>
    <g transform="translate(15, 168)">
      <rect width="130" height="24" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="65" y="16" font-size="10" fill="#475569" text-anchor="middle">olist_customers.csv</text>
    </g>

    <text x="80" y="218" font-size="9.5" font-style="italic" fill="#94a3b8" text-anchor="middle">Local Path: data/</text>
  </g>

  <!-- Flow 1 -> 2 Arrow -->
  <line x1="205" y1="245" x2="230" y2="245" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- ==================== COLUMN 2: AWS S3 BRONZE ==================== -->
  <g transform="translate(235, 125)">
    <rect width="170" height="240" rx="8" fill="#ffffff" stroke="#fef3c7" stroke-width="1" filter="url(#shadow)"/>
    <rect width="170" height="34" rx="8" fill="#fef3c7"/>
    <text x="85" y="22" font-size="12" font-weight="700" fill="#92400e" text-anchor="middle">Bronze Storage</text>

    <!-- S3 Card -->
    <rect x="15" y="48" width="140" height="52" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.2"/>
    <text x="70" y="70" font-size="11" font-weight="700" fill="#b45309" text-anchor="middle">AWS S3 Bucket</text>
    <text x="70" y="86" font-size="9" fill="#78350f" text-anchor="middle">s3://de-fadhli</text>

    <rect x="15" y="112" width="140" height="60" rx="5" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="70" y="132" font-size="10" font-weight="600" fill="#1e293b" text-anchor="middle">bronze/{ds}/</text>
    <text x="70" y="148" font-size="9" fill="#64748b" text-anchor="middle">Partitioned per date</text>
    <text x="70" y="161" font-size="8.5" fill="#10b981" font-weight="600" text-anchor="middle">Idempotent Overwrite</text>

    <text x="85" y="202" font-size="9" fill="#64748b" text-anchor="middle">Region: ap-southeast-3</text>
    <text x="85" y="218" font-size="9" fill="#94a3b8" text-anchor="middle">IAM: de-olist-airflow</text>
  </g>

  <!-- Flow 2 -> 3 Arrow -->
  <line x1="410" y1="245" x2="435" y2="245" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- ==================== COLUMN 3: POSTGRESQL RAW ==================== -->
  <g transform="translate(440, 125)">
    <rect width="170" height="240" rx="8" fill="#ffffff" stroke="#dbeafe" stroke-width="1" filter="url(#shadow)"/>
    <rect width="170" height="34" rx="8" fill="#dbeafe"/>
    <text x="85" y="22" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">Data Warehouse Raw</text>

    <!-- Postgres Card -->
    <rect x="15" y="48" width="140" height="52" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.2"/>
    <text x="70" y="70" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="middle">PostgreSQL 16</text>
    <text x="70" y="86" font-size="9" fill="#1e40af" text-anchor="middle">Schema: raw</text>

    <g transform="translate(15, 110)">
      <rect width="140" height="22" rx="4" fill="#ffffff" stroke="#bfdbfe"/>
      <text x="70" y="15" font-size="9.5" fill="#1e3a8a" text-anchor="middle">raw.raw_orders</text>
    </g>
    <g transform="translate(15, 137)">
      <rect width="140" height="22" rx="4" fill="#ffffff" stroke="#bfdbfe"/>
      <text x="70" y="15" font-size="9.5" fill="#1e3a8a" text-anchor="middle">raw.raw_payments</text>
    </g>
    <g transform="translate(15, 164)">
      <rect width="140" height="22" rx="4" fill="#ffffff" stroke="#bfdbfe"/>
      <text x="70" y="15" font-size="9.5" fill="#1e3a8a" text-anchor="middle">raw.raw_customers</text>
    </g>

    <text x="85" y="210" font-size="9" font-weight="600" fill="#2563eb" text-anchor="middle">Atomic DELETE+INSERT</text>
    <text x="85" y="223" font-size="8.5" fill="#64748b" text-anchor="middle">Partitioned by ds</text>
  </g>

  <!-- Flow 3 -> 4 Arrow -->
  <line x1="615" y1="245" x2="640" y2="245" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- ==================== COLUMN 4: DBT MODELING ==================== -->
  <g transform="translate(645, 125)">
    <rect width="180" height="240" rx="8" fill="#ffffff" stroke="#ffe4e6" stroke-width="1" filter="url(#shadow)"/>
    <rect width="180" height="34" rx="8" fill="#ffe4e6"/>
    <text x="90" y="22" font-size="12" font-weight="700" fill="#9f1239" text-anchor="middle">Analytics Engineering</text>

    <!-- dbt Card -->
    <rect x="15" y="48" width="150" height="52" rx="6" fill="#fff1f2" stroke="#f43f5e" stroke-width="1.2"/>
    <text x="75" y="70" font-size="11" font-weight="700" fill="#e11d48" text-anchor="middle">dbt Core 1.8+</text>
    <text x="75" y="86" font-size="9" fill="#881337" text-anchor="middle">Transformation &amp; Tests</text>

    <g transform="translate(15, 108)">
      <rect width="150" height="24" rx="4" fill="#ffffff" stroke="#fecdd3"/>
      <text x="75" y="16" font-size="9" font-weight="600" fill="#9f1239" text-anchor="middle">staging (views)</text>
    </g>
    <g transform="translate(15, 137)">
      <rect width="150" height="24" rx="4" fill="#ffffff" stroke="#fecdd3"/>
      <text x="75" y="16" font-size="9" font-weight="600" fill="#9f1239" text-anchor="middle">intermediate (agg)</text>
    </g>
    <g transform="translate(15, 166)">
      <rect width="150" height="26" rx="4" fill="#ffe4e6" stroke="#f43f5e" stroke-width="1.2"/>
      <text x="75" y="18" font-size="9" font-weight="700" fill="#881337" text-anchor="middle">marts: fct_transactions</text>
    </g>

    <text x="90" y="214" font-size="8.5" font-weight="600" fill="#059669" text-anchor="middle">&#x2714; Schema Tests: unique, not_null</text>
    <text x="90" y="228" font-size="8" fill="#64748b" text-anchor="middle">+ Risk Flag Logic: is_risky</text>
  </g>

  <!-- Flow 4 -> 5 Arrow -->
  <line x1="830" y1="245" x2="855" y2="245" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- ==================== COLUMN 5: METABASE BI ==================== -->
  <g transform="translate(860, 125)">
    <rect width="120" height="240" rx="8" fill="#ffffff" stroke="#dcfce7" stroke-width="1" filter="url(#shadow)"/>
    <rect width="120" height="34" rx="8" fill="#dcfce7"/>
    <text x="60" y="22" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">Serving &amp; BI</text>

    <!-- Metabase Card -->
    <rect x="12" y="48" width="96" height="52" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.2"/>
    <text x="48" y="70" font-size="11" font-weight="700" fill="#15803d" text-anchor="middle">Metabase</text>
    <text x="48" y="86" font-size="9" fill="#166534" text-anchor="middle">Dashboards</text>

    <g transform="translate(12, 110)">
      <rect width="96" height="24" rx="4" fill="#ffffff" stroke="#bbf7d0"/>
      <text x="48" y="16" font-size="8.5" fill="#14532d" text-anchor="middle">Daily GMV Trend</text>
    </g>
    <g transform="translate(12, 140)">
      <rect width="96" height="24" rx="4" fill="#ffffff" stroke="#bbf7d0"/>
      <text x="48" y="16" font-size="8.5" fill="#14532d" text-anchor="middle">Order Statuses</text>
    </g>
    <g transform="translate(12, 170)">
      <rect width="96" height="24" rx="4" fill="#ffffff" stroke="#bbf7d0"/>
      <text x="48" y="16" font-size="8.5" fill="#14532d" text-anchor="middle">Risk Flag Dist</text>
    </g>

    <text x="60" y="218" font-size="8.5" fill="#15803d" font-weight="600" text-anchor="middle">Port 3000</text>
  </g>

  <!-- ==================== ORCHESTRATION BANNER: AIRFLOW ==================== -->
  <g transform="translate(40, 390)">
    <rect width="940" height="110" rx="8" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.2" filter="url(#shadow)"/>
    <text x="20" y="26" font-size="12" font-weight="700" fill="#6b21a8">ORCHESTRATION: Apache Airflow 2.9 (DAG: olist_daily | Schedule: @daily)</text>

    <!-- Task 1 -->
    <g transform="translate(20, 42)">
      <rect width="190" height="50" rx="6" fill="#ffffff" stroke="#c084fc" stroke-width="1"/>
      <text x="15" y="22" font-size="10.5" font-weight="700" fill="#581c87">1. bronze_to_s3</text>
      <text x="15" y="38" font-size="9" fill="#7e22ce">python to_bronze.py {{ ds }}</text>
    </g>

    <!-- Arrow T1 -> T2 -->
    <line x1="215" y1="67" x2="245" y2="67" stroke="#8b5cf6" stroke-width="1.8" marker-end="url(#arrow-purple)"/>

    <!-- Task 2 -->
    <g transform="translate(250, 42)">
      <rect width="210" height="50" rx="6" fill="#ffffff" stroke="#c084fc" stroke-width="1"/>
      <text x="15" y="22" font-size="10.5" font-weight="700" fill="#581c87">2. load_raw_postgres</text>
      <text x="15" y="38" font-size="9" fill="#7e22ce">python to_postgres.py {{ ds }}</text>
    </g>

    <!-- Arrow T2 -> T3 -->
    <line x1="465" y1="67" x2="495" y2="67" stroke="#8b5cf6" stroke-width="1.8" marker-end="url(#arrow-purple)"/>

    <!-- Task 3 -->
    <g transform="translate(500, 42)">
      <rect width="180" height="50" rx="6" fill="#ffffff" stroke="#c084fc" stroke-width="1"/>
      <text x="15" y="22" font-size="10.5" font-weight="700" fill="#581c87">3. dbt_run</text>
      <text x="15" y="38" font-size="9" fill="#7e22ce">dbt run --profiles-dir .</text>
    </g>

    <!-- Arrow T3 -> T4 -->
    <line x1="685" y1="67" x2="715" y2="67" stroke="#8b5cf6" stroke-width="1.8" marker-end="url(#arrow-purple)"/>

    <!-- Task 4 -->
    <g transform="translate(720, 42)">
      <rect width="195" height="50" rx="6" fill="#ffffff" stroke="#c084fc" stroke-width="1"/>
      <text x="15" y="22" font-size="10.5" font-weight="700" fill="#581c87">4. dbt_test</text>
      <text x="15" y="38" font-size="9" fill="#7e22ce">dbt test --profiles-dir .</text>
    </g>
  </g>
</svg>